# Tool-scope layers (one place documenting all three; Unit D contract):
#   Layer 1 — runtime capabilities catalog (frontend/src/core/capabilities/,
#             served at /api/capabilities/): what the running backend/frontend
#             actually exposes, resolved at runtime.
#   Layer 2 — THIS FILE (agent<->tool map): which desk agents (quant-analyst,
#             technical-analyst, risk-manager) should have which alpha_engine
#             MCP tools in their toolbox. Static; validated against
#             alpha_engine/src/alpha_engine/mcp_server.py @mcp.tool() defs by
#             scripts/validate_quant_tools.py — keep in sync.
#   Layer 3 — MCP server enablement (extensions_config.json; template in
#             extensions_config.example.json): whether the alpha_engine server
#             itself is wired up. The validator cross-checks (warn-only) that
#             the example template still carries the alpha_engine entry.
# NOTE: catalog entries carry no `server` field today — every entry here
# belongs to the single alpha_engine MCP server. A multi-server catalog will
# need a per-entry schema field before entries can map to servers.
#
# Fields:
#   id:          exact MCP tool name (must match mcp_server.py)
#   description: one-line, agent-facing
#   agents:      which deer-flow desk agents should have it in their toolbox
#   mutate:      true if the tool writes data (refresh) — restricted to
#                quant-analyst only

version: 1
# Sibling checkout of this repo (override with ALPHA_ENGINE_SRC for
# scripts/validate_quant_tools.py). Keep portable: no absolute local paths.
source_repo: ../alpha_engine
tools:
  - id: engine_status
    description: Coverage + freshness digest of the local store; call first.
    agents: [quant-analyst, technical-analyst, risk-manager]
    mutate: false
  - id: get_factor_history
    description: Unified factor returns (ff_*, aqr_*, jkp_*, gq_*) by id + range.
    agents: [quant-analyst, risk-manager]
    mutate: false
  - id: list_instruments
    description: Search the S&P500 universe (ticker/name/sector).
    agents: [quant-analyst, technical-analyst, risk-manager]
    mutate: false
  - id: get_price_history
    description: Daily OHLCV + adj_close for one symbol.
    agents: [quant-analyst, technical-analyst]
    mutate: false
  - id: get_latest_quotes
    description: Latest close/adj close/volume for a comma-separated list of symbols.
    agents: [quant-analyst, technical-analyst, risk-manager]
    mutate: false
  - id: cross_section_returns
    description: Cross-section returns for the WHOLE universe (any horizon, optional date/universe filter) with Gini concentration stat. Use for market-breadth/concentration questions instead of looping get_price_history.
    agents: [quant-analyst, risk-manager]
    mutate: false
  - id: universe_members_as_of
    description: Point-in-time S&P 500 membership for a date (survivorship-bias-free, 1996-present). MANDATORY for any historical selection — backtest universes, as-of factor exposures. Never use the current snapshot for past dates.
    agents: [quant-analyst, technical-analyst, risk-manager]
    mutate: false
  - id: run_momentum_backtest
    description: Cross-sectional momentum backtest (lookback x top_n).
    agents: [quant-analyst]
    mutate: false
  - id: run_factor_analysis
    description: Factor tearsheet — IC stats + quantile baskets (builtin or DSL).
    agents: [quant-analyst]
    mutate: false
  - id: ml_signal_scores
    description: Walk-forward ML signal scores for a feature expression.
    agents: [quant-analyst]
    mutate: false
  - id: run_param_sweep
    description: Momentum (lookback x top_n) grid sweep; CUDA when available.
    agents: [quant-analyst]
    mutate: false
  - id: optimize_portfolio
    description: Portfolio optimization (max_sharpe | hrp | equal_weight | black_litterman).
    agents: [quant-analyst, risk-manager]
    mutate: false
  - id: attribute_portfolio
    description: Factor attribution of a fixed-weight portfolio.
    agents: [quant-analyst, risk-manager]
    mutate: false
  - id: portfolio_risk_decomposition
    description: Factor risk decomposition (vol, factor vs idio, concentrations).
    agents: [risk-manager, quant-analyst]
    mutate: false
  - id: alpha_engine_brinson_attribution
    description: Brinson attribution vs benchmark (prefixed MCP name of brinson_attribution).
    agents: [quant-analyst, risk-manager]
    mutate: false
  - id: render_report
    description: Interactive HTML research report/tearsheet from a report dict. Pass theme quantflow-dark/light for flagship-matched styling and png_dir to also export every exhibit to PNG for print reports.
    agents: [quant-analyst]
    mutate: false
  - id: refresh_data
    description: Refresh universe + price data (optionally symbol subset).
    agents: [quant-analyst]
    mutate: true
