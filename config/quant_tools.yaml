  # exa
  - name: web_search_advanced_exa
    server: exa
    tier: core
    purpose: Exa web search with published-date bounds and category filters.
    use_when: Date-bounded news or point-in-time questions (what was known before X); papers and filings discovery.
    agents: [lead, news-analyst, document-analyst, bull-researcher, bear-researcher]
    routing: {priority: 65, keywords: [this week, last month, latest news, since earnings, published before]}
  - name: web_fetch_exa
    server: exa
    tier: core
    purpose: Full-length page text as Markdown (maxCharacters).
    use_when: Pages longer than about 4 KB (filings, long articles) where web_fetch truncates.
    agents: [lead, news-analyst, document-analyst, bull-researcher, bear-researcher]
